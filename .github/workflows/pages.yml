name: Publish landing page

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'cmd/business-brew-site/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test static export
        run: go test ./cmd/business-brew-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Export landing page
        run: go run ./cmd/business-brew-site --output dist --base-path /business-brew/ --repository-url https://github.com/hoermannpaul/business-brew
      - name: Upload landing page only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
